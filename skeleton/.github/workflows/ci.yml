name: CI

# architecture.md §20: 이 CI 는 push 이후 도는 사후 안전망이다.
# 게이트는 push 전 로컬 검증(pytest·ruff·vitest·eslint·build)이다. CI 가 실패하면 되돌리거나 즉시 고친다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    # 이 프로젝트는 Windows 와 macOS/Linux 에서 함께 개발한다.
    # Ubuntu 만 돌리면 OS 분기 버그(경로·인코딩·시각대·휠)를 영원히 못 잡는다.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Pytest
        # 테스트는 SQLite in-memory 사용 — 외부 DB 불필요 (§12)
        run: pytest -q

  migrations:
    # ⚠️ 서비스 컨테이너(postgres:16)는 Linux 러너에서만 동작한다 —
    # windows-latest 는 Linux 컨테이너를 띄우지 못하므로 DB 검증만 별도 ubuntu 잡으로 분리했다.
    # (backend 잡을 OS 매트릭스로 돌리면서 services 를 그대로 두면 Windows 잡이 시작조차 못 한다.)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_migration_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Alembic (마이그레이션 검증)
        # 실제 PostgreSQL 에 마이그레이션을 적용하고 모델과의 불일치를 검사한다 (§11)
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/ci_migration_check
        run: |
          alembic upgrade head
          alembic check

  # .ps1 은 Windows PowerShell 5.1 에서 파싱되어야 한다.
  # PS7 전용 문법(??, ?:, &&/||)이 하나라도 섞이면 5.1 은 한 줄도 실행하지 못하고 죽는다.
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all .ps1 with Windows PowerShell 5.1
        shell: powershell # pwsh 가 아니라 5.1 이어야 의미가 있다
        run: |
          $failed = $false
          $files = Get-ChildItem -Path . -Recurse -File -Force -Filter *.ps1
          if (-not $files) { Write-Host "검사할 .ps1 없음"; exit 0 }
          foreach ($f in $files) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($f.FullName)::구문 오류 $($errors.Count)건"
              foreach ($e in $errors) {
                Write-Host ("  L{0}:{1} {2}" -f $e.Extent.StartLineNumber, $e.Extent.StartColumnNumber, $e.Message)
              }
            } else {
              Write-Host "OK  $($f.FullName)"
            }
          }
          if ($failed) { exit 1 }
      - name: Reject PS7-only syntax
        # 위 파싱 검사는 shell 이 5.1 일 때만 유효하다. 이 검사는 버전과 무관하게 동작한다.
        shell: powershell
        run: |
          $failed = $false
          $ps7Kinds = @('QuestionQuestion','QuestionQuestionEquals','AndAnd','OrOr','QuestionDot','QuestionLBracket')
          foreach ($f in Get-ChildItem -Path . -Recurse -File -Force -Filter *.ps1) {
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$null)
            foreach ($t in $tokens) {
              if ($ps7Kinds -contains "$($t.Kind)") {
                $failed = $true
                Write-Host "::error file=$($f.FullName),line=$($t.Extent.StartLineNumber)::'$($t.Text)' 는 PowerShell 7 전용입니다."
              }
            }
          }
          if ($failed) { exit 1 }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install
      - name: Lint (eslint)
        run: pnpm lint
      - name: Type check (tsc --noEmit)
        # next build 도 타입을 보지만, 빌드 없이 빠르게 실패시키기 위해 따로 둔다.
        run: pnpm typecheck
      - name: Test (vitest)
        # tsc·eslint 가 못 잡는 런타임 동작을 여기서 잡는다 (§13 프론트엔드 테스트)
        run: pnpm test
      - name: Build (next build)
        # 산출물은 Node 런타임용이다 — 정적 export 가 아니다 (§2).
        run: pnpm build
