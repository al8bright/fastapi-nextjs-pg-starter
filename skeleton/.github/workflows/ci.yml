name: CI

# architecture.md §20: 이 CI 는 push 이후 도는 사후 안전망이다.
# 게이트는 push 전 로컬 검증(pytest·ruff·vitest·eslint·build)이다. CI 가 실패하면 되돌리거나 즉시 고친다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 최소 권한 — 미선언이면 리포/조직 설정에 따라 GITHUB_TOKEN 이 read-write 로 발급된다.
# 이 워크플로는 체크아웃과 검증만 하므로 읽기면 충분하다.
permissions:
  contents: read

# 같은 브랜치에 연속 push 하면 이전 실행을 취소해 러너 시간을 아낀다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    # 이 프로젝트는 Windows 와 macOS/Linux 에서 함께 개발한다.
    # Ubuntu 만 돌리면 OS 분기 버그(경로·인코딩·시각대·휠)를 영원히 못 잡는다.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Pytest
        # 테스트는 SQLite in-memory 사용 — 외부 DB 불필요 (§12)
        run: pytest -q

  migrations:
    # ⚠️ 서비스 컨테이너(postgres:16)는 Linux 러너에서만 동작한다 —
    # windows-latest 는 Linux 컨테이너를 띄우지 못하므로 DB 검증만 별도 ubuntu 잡으로 분리했다.
    # (backend 잡을 OS 매트릭스로 돌리면서 services 를 그대로 두면 Windows 잡이 시작조차 못 한다.)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_migration_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Alembic (마이그레이션 검증)
        # 실제 PostgreSQL 에 마이그레이션을 적용하고 모델과의 불일치를 검사한다 (§11)
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/ci_migration_check
        run: |
          alembic upgrade head
          alembic check

  # .ps1 은 Windows PowerShell 5.1 에서 파싱되어야 한다.
  # PS7 전용 문법(??, ?:, &&/||)이 하나라도 섞이면 5.1 은 한 줄도 실행하지 못하고 죽는다.
  powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Check .ps1 syntax with Windows PowerShell 5.1
        shell: powershell # pwsh 가 아니라 5.1 이어야 의미가 있다
        # ⛔ 검사 로직을 여기 인라인으로 되돌리지 마라. Actions 는 이 스텝을 BOM 없는 UTF-8
        #    임시 파일로 쓰는데 5.1 은 그것을 ANSI 로 읽어 한글이 깨지고 따옴표 짝이 무너진다
        #    ("The string is missing the terminator"). 스크립트 파일은 BOM 을 달아 커밋한다.
        run: .\.github\scripts\check-ps1-syntax.ps1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install
      - name: Lint (eslint)
        run: pnpm lint
      - name: Type check (tsc --noEmit)
        # next build 도 타입을 보지만, 빌드 없이 빠르게 실패시키기 위해 따로 둔다.
        run: pnpm typecheck
      - name: Test (vitest)
        # tsc·eslint 가 못 잡는 런타임 동작을 여기서 잡는다 (§13 프론트엔드 테스트)
        run: pnpm test
      - name: Build (next build)
        # 산출물은 Node 런타임용이다 — 정적 export 가 아니다 (§2).
        run: pnpm build
