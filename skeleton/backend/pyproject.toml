# 백엔드 린트/포맷 설정 (ruff) — architecture.md §19 "린트 경고 0".
# CI(.github/workflows/ci.yml)와 로컬에서 `ruff check .` / `ruff format` 로 사용.

[tool.ruff]
target-version = "py313"
line-length = 120   # 한글 주석 고려
# Alembic(자동 생성 마이그레이션 + sys.path 부트스트랩이 있는 env.py)은 린트 제외.
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 의 Depends/Query 등은 인자 기본값 호출이 정상 패턴 → B008 제외.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.Form",
  "fastapi.File",
  "fastapi.Security",
]
