name: Template CI

# 이 워크플로는 "스캐폴드 스크립트 자체"를 검증한다.
# skeleton/.github/workflows/ci.yml 은 *생성된 프로젝트* 용이라 템플릿 리포에서는 돌지 않는다.
# 그 공백 때문에 scaffold.ps1 이 어떤 PowerShell 에서도 실행되지 않는 상태로,
# 또 bootstrap 이 skeleton/.python-version 을 덮어쓰는 상태로 커밋된 적이 있다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 최소 권한 — 미선언이면 리포/조직 설정에 따라 GITHUB_TOKEN 이 read-write 로 발급된다.
# 이 워크플로는 체크아웃과 검증만 하므로 읽기면 충분하다.
permissions:
  contents: read

# 같은 브랜치에 연속 push 하면 이전 실행을 취소해 러너 시간을 아낀다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── 1. PowerShell 구문 검사 (가장 중요) ──────────────────────────────────
  # scaffold.ps1 은 #requires -Version 5.1 을 선언한다. Windows 기본 셸이 5.1 이므로
  # PS7 전용 문법(??, ?:, &&/||)이 하나라도 있으면 파싱 단계에서 통째로 죽는다.
  powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Parse .ps1 with Windows PowerShell 5.1
        shell: powershell # pwsh 로 바꾸면 PS7 전용 문법을 놓친다
        run: |
          $failed = $false
          $files = Get-ChildItem -Path . -Recurse -File -Force -Filter *.ps1
          if (-not $files) { Write-Host "검사할 .ps1 없음"; exit 0 }
          foreach ($f in $files) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($f.FullName)::구문 오류 $($errors.Count)건"
              foreach ($e in $errors) {
                Write-Host ("  L{0}:{1} {2}" -f $e.Extent.StartLineNumber, $e.Extent.StartColumnNumber, $e.Message)
              }
            } else {
              Write-Host "OK  $($f.FullName)"
            }
          }
          if ($failed) { exit 1 }

      # 파싱만으로는 (try {...} catch {...}) 같은 "파싱은 되지만 실행 시 죽는" 구문을 못 잡는다.
      # try/if/foreach 를 인자 위치(괄호 안)에 쓴 곳을 AST 로 직접 찾는다.
      # PS7 전용 토큰도 함께 스캔한다 — 위 파싱 검사는 shell 이 5.1 일 때만 유효하므로
      # 누군가 shell 을 pwsh 로 바꿔도 이 검사는 계속 동작한다.
      - name: Reject PS7-only syntax and statements used as arguments
        shell: powershell
        run: |
          $failed = $false
          $ps7Kinds = @('QuestionQuestion','QuestionQuestionEquals','AndAnd','OrOr','QuestionDot','QuestionLBracket')
          foreach ($f in Get-ChildItem -Path . -Recurse -File -Force -Filter *.ps1) {
            $tokens = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$null)
            foreach ($t in $tokens) {
              if ($ps7Kinds -contains "$($t.Kind)") {
                $failed = $true
                Write-Host "::error file=$($f.FullName),line=$($t.Extent.StartLineNumber)::'$($t.Text)' 는 PowerShell 7 전용입니다. Windows PowerShell 5.1 은 파싱 단계에서 실패합니다."
              }
            }
            $bad = $ast.FindAll({
              param($n)
              $n -is [System.Management.Automation.Language.StringConstantExpressionAst] -and
              $n.StringConstantType -eq 'BareWord' -and
              $n.Value -in @('try', 'if', 'foreach', 'while', 'switch') -and
              $n.Parent -is [System.Management.Automation.Language.CommandAst]
            }, $true)
            foreach ($b in $bad) {
              $failed = $true
              Write-Host "::error file=$($f.FullName),line=$($b.Extent.StartLineNumber)::'$($b.Value)' 문을 인자 자리에 사용했습니다. 명령어로 해석되어 실행 시 실패합니다."
            }
          }
          if ($failed) { exit 1 }

  # ── 2. bash 구문 검사 ────────────────────────────────────────────────────
  # scaffold.sh / bootstrap.sh 는 파싱 오류만으로도 사용자 환경에서 즉사한다.
  # 실행 없이 파싱만 하는 `bash -n` 으로 전체 .sh 를 훑는다.
  bash-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: bash -n (모든 .sh)
        run: |
          failed=0
          while IFS= read -r f; do
            if bash -n "$f"; then
              echo "OK  $f"
            else
              echo "::error file=$f::bash 구문 오류"
              failed=1
            fi
          done < <(find . -path ./.git -prune -o -name '*.sh' -print)
          exit $failed
      - name: ShellCheck (경고만 — 실패시키지 않음)
        continue-on-error: true
        run: shellcheck -S warning scaffold.sh skeleton/scripts/bootstrap.sh || true

  # ── 3. POSIX 스캐폴드 실제 실행 (생성물까지 검증) ────────────────────────
  scaffold-posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: skeleton/.python-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: skeleton/.nvmrc
      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Run scaffold.sh
        run: bash ./scaffold.sh --name CiDemo --target "$RUNNER_TEMP/CiDemo" --skip-db --skip-install --design < /dev/null

      - name: 템플릿 리포가 오염되지 않았는지 확인
        # bootstrap 이 skeleton/.python-version·.nvmrc 를 덮어쓰던 회귀를 막는다.
        # pnpm 이 skeleton/frontend/pnpm-workspace.yaml 에 allowBuilds 를 자동 삽입하는 회귀도 함께 잡힌다.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::스캐폴드 실행이 템플릿 리포를 변경했습니다:"
            git status --porcelain
            exit 1
          fi

      - name: 잔여 토큰이 없는지 확인
        run: |
          if grep -rl '__PROJECT_NAME__\|__PROJECT_SNAKE__\|__THEME_CSS__' "$RUNNER_TEMP/CiDemo"; then
            echo "::error::치환되지 않은 토큰이 남아 있습니다"
            exit 1
          fi

      - name: 생성물 백엔드 검증 (ruff + pytest)
        working-directory: ${{ runner.temp }}/CiDemo/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ruff check .
          pytest -q

      - name: 생성물 프론트 검증 (install + lint + typecheck + test + build)
        working-directory: ${{ runner.temp }}/CiDemo/frontend
        run: |
          pnpm install
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
